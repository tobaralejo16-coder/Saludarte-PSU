[env:esp32dev]
; Version fijada: Arduino-ESP32 2.0.17 / ESP-IDF 4.4, API I2S legacy.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
board_build.partitions = partitions.csv
lib_deps = h2zero/NimBLE-Arduino@2.3.6
build_flags = -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
; SPIFFS e I2S vienen incluidos en el framework.
